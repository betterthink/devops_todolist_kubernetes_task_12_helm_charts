apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Chart.Name }}-data
  namespace: {{ .Values.namespace.name }}
spec:
  storageClassName: standard
  persistentVolumeReclaimPolicy: Delete
  accessModes:
    - ReadWriteMany
  capacity:
    storage: {{ .Values.pv.storage }}
  hostPath:
    path: /data/
